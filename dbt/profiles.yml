# Подключение dbt к ClickHouse и база для результатов моделей.
fraud_analytics:
  target: dev
  outputs:
    dev:
      type: clickhouse
      driver: http
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'student') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'homework') }}"
      schema: analytics
      threads: 2
      connect_timeout: 10
      send_receive_timeout: 300
