# Описания подготовленных полей и тесты качества транзакций.
version: 2

models:
  - name: stg_transactions
    description: Подготовленные транзакции с нормализованными строками, ключом клиента и сегментом суммы.
    columns:
      - name: transaction_id
        description: Уникальный номер строки исходного CSV.
        tests: [not_null, unique]
      - name: transaction_time
        description: Время транзакции в принятом для проекта UTC.
        tests: [not_null]
      - name: transaction_date
        description: Дата транзакции для дневных агрегатов.
        tests: [not_null]
      - name: transaction_hour
        description: Час операции, от 0 до 23.
      - name: day_of_week
        description: День недели по ISO, понедельник — 1, воскресенье — 7. Рассчитан через dbt_date.
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false
      - name: merchant
        description: Мерчант без пробелов по краям.
        tests: [not_null]
      - name: category
        description: Категория покупки в нижнем регистре.
        tests: [not_null]
      - name: amount
        description: Сумма транзакции.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: first_name
        description: Имя клиента без пробелов по краям.
      - name: last_name
        description: Фамилия клиента без пробелов по краям.
      - name: gender
        description: Пол клиента в верхнем регистре.
        tests:
          - accepted_values:
              arguments:
                values: [M, F]
      - name: state_code
        description: Двухбуквенный код штата или DC в верхнем регистре.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('states')
                field: state_code
      - name: street
        description: Адрес клиента, часть составного ключа.
      - name: post_code
        description: Почтовый индекс клиента в строковом виде.
      - name: customer_id
        description: Приближённый ключ из имени, фамилии, адреса и индекса; не гарантирует идентификацию реального человека.
        tests: [not_null]
      - name: lat
        description: Широта клиента.
      - name: lon
        description: Долгота клиента.
      - name: merchant_lat
        description: Широта мерчанта.
      - name: merchant_lon
        description: Долгота мерчанта.
      - name: is_fraud
        description: Признак мошенничества из target, 0 или 1.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: amount_bucket
        description: SMALL — меньше 100, MEDIUM — от 100 до порога крупной суммы, LARGE — от порога. По умолчанию порог 1000.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [SMALL, MEDIUM, LARGE]
      - name: is_large
        description: Сумма не меньше large_amount_threshold, по умолчанию 1000.
